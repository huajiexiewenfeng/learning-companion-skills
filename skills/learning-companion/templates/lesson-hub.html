<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>$title</title><style>$theme_css
.hub-page { max-width: var(--content-width); margin: 0 auto; padding: 1.5rem; }
.hub-header { position: sticky; top: 0; z-index: 1; padding: 1.25rem; border: 1px solid var(--color-line); border-radius: var(--radius-panel); background: var(--color-panel); box-shadow: var(--shadow-panel); }
.hub-header h1 { margin-bottom: .5rem; }.hub-meta { display: flex; flex-wrap: wrap; gap: 1rem; margin: 0; }.hub-meta div { min-width: 5rem; }.hub-meta dt { color: var(--color-muted); font-size: .8rem; }.hub-meta dd { margin: 0; font-weight: 700; }.hub-question, .hub-sync-state { margin: .75rem 0 0; color: var(--color-muted); }.hub-sync-state { color: var(--color-gate); font-weight: 700; }
.hub-layout { display: grid; grid-template-columns: minmax(13rem, .45fr) minmax(0, 1fr); gap: 1.25rem; margin-top: 1.25rem; }.turn-outline { align-self: start; position: sticky; top: 14rem; padding: 1.25rem; border: 1px solid var(--color-line); border-radius: var(--radius-panel); background: var(--color-panel); }.turn-outline h2 { margin-bottom: .5rem; }.turn-outline ol { margin: 0; padding-left: 1.25rem; }.turn-outline a, .artifact-link { color: var(--color-active); }.timeline { display: grid; gap: 1rem; }.hub-card { padding: 1.25rem; border: 1px solid var(--color-line); border-left: .35rem solid var(--color-neutral); border-radius: var(--radius-panel); background: var(--color-panel); box-shadow: var(--shadow-panel); }.card--conclusion, .card--answer { border-left-color: var(--color-success); }.card--misconception, .card--correction { border-left-color: var(--color-risk); }.card--visual, .card--check { border-left-color: var(--color-gate); }.card--explanation, .card--case { border-left-color: var(--color-active); }.artifact-count { color: var(--color-muted); font-size: .9rem; }
@media (max-width: 720px) { .hub-page { padding: .85rem; }.hub-header, .turn-outline { position: static; }.hub-layout { grid-template-columns: 1fr; }.turn-outline { order: -1; } }
</style></head><body>$body$data_script$refresh_script</body></html>
